<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Context &amp; Harness Engineering</title>
<link rel="stylesheet" href="presentation.css"><script defer src="slides.js"></script><script defer src="example.js"></script><script defer src="diagrams.js"></script><script defer src="presentation.js"></script></head>
<body>
<main>
  <header><span>ENGINEERING PRACTICES</span><strong>Context &amp; Harness Engineering</strong></header>

<dialog id="example" aria-labelledby="question">
  <div class="dialog-head"><span class="eyebrow" id="controlName"></span><button id="close" autofocus>Close ×</button></div>
